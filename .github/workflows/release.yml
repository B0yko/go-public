name: Release

# Push a tag `vX.Y.Z` and the sdist and wheel are attached to that tag's GitHub Release
# (created here only if it does not exist yet, with the notes from CHANGELOG.md).
#
# Publishing to PyPI is a separate, manual job: open Actions > Release > Run workflow, pick
# the tag under "Use workflow from", and run it. It uses PyPI trusted publishing, so it
# needs a trusted publisher configured on PyPI first (owner B0yko, repository go-public,
# workflow release.yml, environment pypi). It never runs on a tag push, so a missing
# publisher cannot turn a release red.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: uv build

      - name: The wheel installs and runs
        run: uvx --from "$(ls dist/*.whl)" go-public --version

      - name: Attach to the GitHub Release, creating it if it is missing
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  pypi:
    name: PyPI
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: uv build

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
